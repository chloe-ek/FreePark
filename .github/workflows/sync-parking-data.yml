name: Sync Vancouver Parking Data

on:
  schedule:
    - cron: '0 15 * * 1'  # Every Monday 15:00 UTC (Monday 8 AM Vancouver time, after Vancouver data refresh)
  workflow_dispatch:      # Manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Seed parking meters
        run: npx tsx scripts/seed-meters.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Seed motorcycle parking
        run: npx tsx scripts/seed-motorcycle-parking.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Parking data sync failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The weekly parking data sync failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug'],
            })
